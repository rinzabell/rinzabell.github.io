<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f1f">
<title>DDF</title>
<style>
:root{--gold:#ff9a5c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:#fff;font-family:"Hiragino Sans","Noto Sans JP","Noto Sans SC","Noto Sans KR","Noto Sans Thai",system-ui,sans-serif;
background:radial-gradient(120% 60% at 50% 0%,#4a2c4f 0%,#140f1f 62%) fixed,#140f1f}
main{max-width:520px;margin:0 auto;color:#fff;background:linear-gradient(180deg,#2b1c3a 0%,#140f1f 100%);
padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
figure{margin:0 0 22px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,154,92,.5);box-shadow:0 12px 34px rgba(0,0,0,.5)}
figure img{display:block;width:100%;height:auto}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;padding:20px 18px;margin-bottom:14px;border-radius:16px;
background:linear-gradient(135deg,#40295a,#1f1431);border:1px solid rgba(255,154,92,.75);
box-shadow:0 8px 22px rgba(0,0,0,.45);
opacity:0;transform:translateY(10px);animation:in .6s ease forwards;transition:transform .15s,border-color .15s}
.btn:nth-of-type(2){animation-delay:.1s}.btn:nth-of-type(3){animation-delay:.2s}
.btn:active{transform:scale(.98);border-color:#ff9a5c}
.ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;background:rgba(255,154,92,.22);border:1px solid rgba(255,154,92,.7)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:.02em}
.txt span{display:block;margin-top:3px;font-size:1rem;font-weight:600;color:#ffd9bf}
.go{flex:none;color:#ff9a5c;font-size:1.7rem;font-weight:700;line-height:1}
.btn:focus-visible{outline:3px solid #ff9a5c;outline-offset:3px}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.btn{animation:none;opacity:1;transform:none}}
</style>
