<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDF - Ding-Dong Fountain</title>
<!-- Apple サイトと同じ系統：SF Pro（San Francisco）スタック -->
<style>
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  text-align: center;
  color: #000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  isolation: isolate;
}
/* 固定の背景画像＝半透明 80% */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: url("https://pbs.twimg.com/media/HVkxutZa4AA9ofv.jpg") center / cover no-repeat;
  opacity: .8;
}
.page { padding: 42px 20px 44px; }

.links { width: 100%; max-width: 540px; margin: 0 auto; }
/* 【変更58】ボタン削除ぶん（約60px）だけ箱間の幅を詰める：150px → 90px */
.link-card { width: 100%; margin: 0 auto 90px; }
.links .last-card { margin-bottom: 0; }

.card-square {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 24px;
}

.card-title {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 2.3 1 0;
  min-height: 0;
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 12px 20px;
  border-radius: 0;
  background: rgba(222, 156, 143, 0.5);
  color: #fff;
  font-size: 40px;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.5px;
  text-align: center;
}

.header-title {
  flex-direction: column;
  gap: 6px;
  padding: 8px 14px;
}
.header-main {
  font-size: 40px;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.header-sub {
  font-size: 21px;
  line-height: 1.3;
  font-weight: 400;
  letter-spacing: 0;
}

.card-image-zone {
  flex: 4.3 1 0;
  min-height: 0;
  background: rgba(255, 255, 255, 0.5);
}

.zone-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  opacity: .5;
}

.guild-card .card-title { flex: 2.7 1 0; }

/* 【変更58】残るボタンは2つだけ：Festa の Learn more と Creation の Top */
.learn-more {
  display: inline-block;
  margin-top: 18px;
  padding: 11px 24px;
  border-radius: 24px;
  background: #1B3496;
  color: #fff;
  opacity: 1;
  font-size: 16px;
  line-height: 1.2;
  font-weight: 700;
  text-decoration: none;
  transition: opacity .2s, transform .2s;
}
.learn-more:hover { opacity: .9; transform: translateY(-2px); }

/* 【変更61】TopリンクとSNSリンクの間：100px */
.social-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 54px;
  margin: 100px auto 0;
}
.social-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #1B3496;
  color: #fff;
  opacity: 1;
  transition: opacity .2s, transform .2s;
}
.social-link:hover { opacity: .9; transform: translateY(-3px); }
.social-link svg {
  display: block;
  width: 24px;
  height: 24px;
  fill: currentColor;
}
.social-link .stroke-icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

/* 【変更62】一番下の空箱を50px小さく：540px → 490px */
.end-spacer {
  width: 100%;
  height: 490px;
}

@media (max-width: 600px) {
  .page { padding: 34px 18px 36px; }
  /* 【変更58】モバイルも詰める：130px → 70px */
  .link-card { margin-bottom: 70px; }
  .links .last-card { margin-bottom: 0; }
  .card-title {
    padding: 11px 14px;
    font-size: 40px;
    font-weight: 700;
    border-radius: 0;
  }
  .header-main { font-size: 40px; }
  .header-sub { font-size: 21px; }
  /* 【変更61】モバイルも100px */
  .social-links { gap: 38px; margin-top: 100px; }
  .social-link { width: 38px; height: 38px; }
  .social-link svg { width: 22px; height: 22px; }
  /* 【変更62】モバイルの空箱も50px小さく：(画面幅-36px)-50px */
  .end-spacer { height: calc(100vw - 86px); }
}
</style>
</head>
<body>
<main class="page">
  <section class="links" aria-label="DDF links">

    <!-- 1番目：Claire Rinzabell（ボタン削除） -->
    <article class="link-card">
      <div class="card-square">
        <h2 class="card-title header-title">
          <span class="header-main">Claire Rinzabell</span>
          <span class="header-sub">Your SI Influencer</span>
        </h2>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HVvlDTzacAANe4A.jpg" alt="Claire Rinzabell">
        </div>
      </div>
    </article>

    <!-- 2番目：DDF（Purpose ボタン削除） -->
    <header class="link-card">
      <div class="card-square">
        <h1 class="card-title header-title">
          <span class="header-main">DDF</span>
          <span class="header-sub">Ding-Dong Fountain</span>
          <span class="header-sub">For Sharing the Oxytocin Loop</span>
        </h1>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HVv5vzoa0AAKfTA.jpg" alt="DDF">
        </div>
      </div>
    </header>

    <!-- 3番目：Siesta（指定画像を表示） -->
    <article class="link-card">
      <div class="card-square">
        <h2 class="card-title header-title">
          <span class="header-main">Siesta</span>
        </h2>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HV4ErUEboAAq8bM.jpg" alt="Siesta">
        </div>
      </div>
    </article>

    <!-- 4番目：Amigo（指定画像を表示） -->
    <article class="link-card guild-card">
      <div class="card-square">
        <h2 class="card-title header-title">
          <span class="header-main">Amigo</span>
          <span class="header-sub">on Discord</span>
        </h2>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HV0Nv_fbUAAfefi.jpg" alt="Amigo on Discord">
        </div>
      </div>
    </article>

    <!-- 5番目：Festa（Learn more は残す） -->
    <article class="link-card">
      <div class="card-square">
        <h2 class="card-title header-title">
          <span class="header-main">Festa</span>
          <span class="header-sub">on X</span>
        </h2>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HVwAo9kbsAAaKPC.jpg" alt="Festa on X">
        </div>
      </div>
      <a class="learn-more" href="https://x.com/claire_rinzabel/" target="_blank" rel="noopener noreferrer">Learn more</a>
    </article>

    <!-- 6番目：Creation（GitHub・ボタンなし） -->
    <article class="link-card">
      <div class="card-square">
        <h2 class="card-title header-title">
          <span class="header-main">Creation</span>
          <span class="header-sub">on GitHub</span>
        </h2>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HVvusI9bYAAKzVY.jpg" alt="Creation on GitHub">
        </div>
      </div>
    </article>

    <!-- 7番目：DDF Members Club（Ring the Bell Guild・Topリンク付き＝最後の箱） -->
    <article class="link-card last-card">
      <div class="card-square">
        <h2 class="card-title header-title">
          <span class="header-main">DDF Members Club</span>
        </h2>
        <div class="card-image-zone">
          <img class="zone-image" src="https://pbs.twimg.com/media/HVksIqnbAAAp0W9.jpg" alt="DDF Members Club">
        </div>
      </div>
      <a class="learn-more" href="#">Top</a>
    </article>

    <nav class="social-links" aria-label="Social media">
      <a class="social-link" href="https://x.com/claire_rinzabel/" aria-label="X" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.3-8.4L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20Z"/></svg>
      </a>
      <a class="social-link" href="https://www.instagram.com/claire_rinzabell/" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
        <svg class="stroke-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.7" r=".8" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="social-link" href="https://www.tiktok.com/@claire_rinzabell/" aria-label="TikTok" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M19.6 7.2a6.7 6.7 0 0 1-4.1-1.4v8.1a6.1 6.1 0 1 1-5.3-6.1v3.3a2.9 2.9 0 1 0 2 2.8V2.2h3.3a6.6 6.6 0 0 0 4.1 4.1v.9Z"/></svg>
      </a>
      <a class="social-link" href="https://www.youtube.com/" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
      </a>
    </nav>

    <div class="end-spacer" aria-hidden="true"></div>

  </section>
</main>
</body>
</html>
